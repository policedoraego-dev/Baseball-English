<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>⚾ Clubhouse Phrase Book — City Connect Edition</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clubhouse" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #111111;
      --surface:    #1c1c1c;
      --surface2:   #242424;
      --surface3:   #2e2e2e;
      --border:     #333333;
      --pink:       #ff2d78;
      --pink-dim:   #cc1f5e;
      --pink-pale:  #2a0d17;
      --mint:       #00e5a0;
      --mint-dim:   #00b07a;
      --mint-pale:  #001a11;
      --gold:       #ffd700;
      --gold-dim:   #c9a900;
      --gold-pale:  #1f1a00;
      --text:       #f0f0f0;
      --text-sub:   #a0a0a0;
      --text-muted: #666666;
      --es-text:    #00e5a0;
      --es-bg:      #001a11;
      --es-border:  #00b07a;
      --radius:     10px;
      --shadow:     0 2px 12px rgba(0,0,0,.5);
      --shadow-lg:  0 8px 32px rgba(0,0,0,.7);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 50%, #0d0d0d 100%);
      border-bottom: 2px solid var(--pink);
      padding: 20px 24px 16px;
      box-shadow: 0 4px 24px rgba(255,45,120,.2);
    }
    .header-inner { max-width: 960px; margin: 0 auto; }
    .header-top { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .header-icon {
      width: 48px; height: 48px;
      background: radial-gradient(circle, var(--pink) 0%, var(--pink-dim) 100%);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      box-shadow: 0 0 16px rgba(255,45,120,.5);
    }
    .header h1 { font-size: 1.4rem; font-weight: 800; color: var(--text); letter-spacing: -.3px; }
    .header-sub { font-size: .78rem; color: var(--gold); opacity: .9; margin-left: 62px; margin-top: 2px; }
    .voice-indicator { font-size: .7rem; color: var(--text-muted); margin-left: 62px; margin-top: 2px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .cc-badge {
      font-size: .62rem; background: linear-gradient(90deg, var(--pink), var(--mint));
      color: #000; border-radius: 10px; padding: 1px 8px; font-weight: 800;
      letter-spacing: .5px; margin-left: 6px; vertical-align: middle;
    }

    .main { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }

    /* ── Translate Panel ── */
    .translate-panel {
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      margin-bottom: 24px;
      border: 1.5px solid var(--pink);
    }
    .translate-panel-header {
      background: linear-gradient(135deg, #1a0a10 0%, #2a0d17 100%);
      padding: 12px 18px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--pink-dim);
    }
    .translate-panel-header-icon {
      width: 28px; height: 28px; background: var(--pink);
      border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
    }
    .translate-panel-title { font-size: .9rem; font-weight: 700; color: var(--text); }
    .translate-panel-subtitle { font-size: .72rem; color: var(--gold); opacity: .85; margin-left: auto; }

    .translate-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
    @media (max-width: 620px) {
      .translate-body { grid-template-columns: 1fr; }
      .translate-divider { height: 36px; border-left: none; border-right: none; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    }
    .translate-src { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .translate-lang-label { font-size: .7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .8px; }
    .translate-textarea {
      flex: 1; border: none; outline: none; resize: none;
      font-size: .96rem; line-height: 1.6; color: var(--text);
      font-family: inherit; min-height: 90px; background: transparent;
    }
    .translate-textarea::placeholder { color: var(--text-muted); }
    .translate-src-footer { display: flex; align-items: center; justify-content: space-between; }
    .translate-clear { background: none; border: none; cursor: pointer; font-size: .75rem; color: var(--text-muted); padding: 4px 8px; border-radius: 6px; }
    .translate-clear:hover { color: var(--pink); background: var(--pink-pale); }
    .char-count { font-size: .7rem; color: var(--text-muted); }
    .translate-divider {
      display: flex; align-items: flex-start; justify-content: center;
      padding: 20px 4px 0; background: var(--surface2);
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    }
    .translate-arrow-icon {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--pink); display: flex; align-items: center;
      justify-content: center; color: #fff; font-size: 13px;
    }
    .translate-dst { display: flex; flex-direction: column; }
    .lang-block { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
    .lang-block-es { background: var(--es-bg); border-top: 1.5px dashed var(--es-border); }
    .lang-flag-label { font-size: .72rem; font-weight: 700; letter-spacing: .7px; display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
    .lang-flag-label.en { color: var(--gold); }
    .lang-flag-label.es { color: var(--mint); }
    .translate-result-text { font-size: 1.05rem; font-weight: 600; color: var(--text); line-height: 1.55; min-height: 50px; white-space: pre-wrap; }
    .translate-result-text.placeholder { font-weight: 400; color: var(--text-muted); font-size: .88rem; min-height: 40px; }
    .translate-result-text.loading { color: var(--text-muted); font-size: .88rem; font-style: italic; display: flex; align-items: center; gap: 8px; }
    .translate-result-text.error { color: var(--pink); font-size: .85rem; font-weight: 400; }
    .translate-result-text.es-text { color: var(--mint); }
    .translate-ipa-row { display: flex; align-items: center; gap: 8px; min-height: 20px; }
    .translate-ipa-text { font-size: .82rem; color: var(--text-muted); font-family: 'Georgia','Times New Roman',serif; letter-spacing: .3px; }
    .translate-ipa-text.es { color: var(--mint-dim); }
    .translate-ipa-loading { font-size: .75rem; color: var(--text-muted); font-style: italic; display: flex; align-items: center; gap: 6px; }
    .spinner-sm { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--pink); animation: spin .7s linear infinite; flex-shrink: 0; }
    .lang-speak-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .speak-big-btn {
      display: flex; align-items: center; gap: 6px; padding: 7px 14px;
      border: none; border-radius: 8px; background: var(--pink); color: #fff;
      cursor: pointer; font-size: .82rem; font-weight: 700; transition: background .15s;
    }
    .speak-big-btn:hover { background: var(--pink-dim); }
    .speak-big-btn:disabled { opacity: .4; cursor: default; }
    .speak-big-btn.speaking { background: var(--gold); color: #000; animation: pulse 1s infinite; }
    .speak-big-btn.es-btn { background: var(--mint-dim); color: #000; }
    .speak-big-btn.es-btn:hover { background: var(--mint); }
    .speak-big-btn.es-btn.speaking { background: var(--gold); color: #000; }
    .translate-save-row {
      padding: 10px 16px 14px; border-top: 1px solid var(--border);
      display: flex; justify-content: flex-end; background: var(--surface);
    }
    .save-translate-btn {
      display: flex; align-items: center; gap: 5px; padding: 9px 18px;
      border: 1.5px solid var(--gold); border-radius: 8px;
      background: var(--gold-pale); cursor: pointer;
      font-size: .85rem; font-weight: 700; color: var(--gold);
    }
    .save-translate-btn:hover { background: #2a2200; }
    .save-translate-btn:disabled { opacity: .4; cursor: default; }
    .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--pink); animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toolbar ── */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .search-wrap { flex: 1 1 220px; position: relative; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 15px; pointer-events: none; }
    .search-input {
      width: 100%; padding: 10px 12px 10px 36px;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      font-size: .92rem; background: var(--surface); color: var(--text); outline: none; transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--pink); }
    .search-input::placeholder { color: var(--text-muted); }
    .add-btn {
      padding: 9px 18px; background: var(--pink); border: none;
      border-radius: var(--radius); font-size: .88rem; font-weight: 700;
      cursor: pointer; color: #fff; white-space: nowrap;
    }
    .add-btn:hover { background: var(--pink-dim); }

    /* ── Filter ── */
    .filter-row { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; scrollbar-width: none; align-items: center; margin-bottom: 14px; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 7px 14px; border: 1.5px solid var(--border); border-radius: 20px;
      background: var(--surface); font-size: .82rem; cursor: pointer;
      transition: all .15s; white-space: nowrap; color: var(--text-sub);
      display: flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    .filter-btn:hover { border-color: var(--pink); color: var(--text); }
    .filter-btn.active { background: var(--pink); border-color: var(--pink); color: #fff; }
    .filter-btn .del-cat { font-size: .65rem; opacity: .6; margin-left: 2px; border: none; background: none; cursor: pointer; padding: 0 2px; color: inherit; }
    .filter-btn .del-cat:hover { opacity: 1; }
    .add-cat-btn { padding: 7px 12px; border: 1.5px dashed var(--border); border-radius: 20px; background: transparent; font-size: .82rem; cursor: pointer; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .add-cat-btn:hover { border-color: var(--mint); color: var(--mint); }
    .stats { font-size: .78rem; color: var(--text-muted); margin-bottom: 12px; }

    /* ── Cards ── */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap: 14px; }
    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px 16px 0; cursor: pointer;
      transition: transform .15s, box-shadow .15s; border-top: 3px solid transparent;
      position: relative; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255,45,120,.2); }
    .card-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .7rem; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .card-phrase { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.35; margin-bottom: 3px; padding-right: 62px; }
    .card-ipa { font-size: .75rem; color: var(--text-muted); font-family: 'Georgia','Times New Roman',serif; margin-bottom: 2px; }
    .card-reading { font-size: .78rem; color: var(--text-muted); margin-bottom: 6px; }
    .card-es-block { margin: 6px 0 4px; padding: 6px 10px; background: var(--es-bg); border-left: 3px solid var(--mint-dim); border-radius: 0 6px 6px 0; }
    .card-phrase-es { font-size: .9rem; font-weight: 700; color: var(--mint); line-height: 1.35; }
    .card-ipa-es { font-size: .72rem; color: var(--mint-dim); font-family: 'Georgia','Times New Roman',serif; margin-top: 2px; }
    .card-meaning { font-size: .86rem; color: var(--text-sub); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag { font-size: .68rem; padding: 2px 7px; background: var(--surface2); color: var(--text-muted); border-radius: 10px; }
    .card-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
    .card:hover .card-actions { opacity: 1; }
    .icon-btn { width: 36px; height: 36px; border: none; background: var(--surface2); border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: background .12s; }
    .icon-btn:hover { background: var(--surface3); }
    .icon-btn.delete:hover { background: var(--pink-pale); }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; border-top: 1px solid var(--border); padding: 8px 0 10px; gap: 6px; }
    .card-speak-group { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .speak-btn {
      display: flex; align-items: center; gap: 5px; padding: 5px 10px;
      border: 1.5px solid var(--border); border-radius: 20px; background: var(--surface2);
      cursor: pointer; font-size: .74rem; color: var(--text-sub); transition: all .15s;
    }
    .speak-btn:hover { border-color: var(--pink); color: var(--pink); }
    .speak-btn.speaking { border-color: var(--gold); color: var(--gold); animation: pulse 1s infinite; }
    .speak-btn.es { border-color: var(--mint-dim); color: var(--mint); }
    .speak-btn.es:hover { border-color: var(--mint); background: var(--mint-pale); }
    .speak-btn.es.speaking { border-color: var(--gold); color: var(--gold); animation: pulse 1s infinite; }
    .word-toggle-btn {
      display: flex; align-items: center; gap: 4px; padding: 5px 10px;
      border: 1.5px solid var(--border); border-radius: 20px; background: var(--surface2);
      cursor: pointer; font-size: .74rem; color: var(--text-sub); transition: all .15s; flex-shrink: 0;
    }
    .word-toggle-btn:hover { border-color: var(--mint); color: var(--mint); }
    .word-toggle-btn.open { border-color: var(--mint); color: var(--mint); background: var(--mint-pale); }

    /* ── Word Breakdown ── */
    .word-breakdown { padding: 10px 0 12px; border-top: 1px solid var(--border); }
    .word-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .word-chip {
      display: inline-flex; flex-direction: column; padding: 6px 10px;
      border: 1.5px solid var(--border); border-radius: 8px;
      background: var(--surface2); cursor: pointer; transition: all .15s;
    }
    .word-chip:hover { border-color: var(--pink); background: var(--pink-pale); }
    .word-chip.speaking { border-color: var(--gold); background: var(--gold-pale); }
    .word-chip.es { border-color: var(--mint-dim); background: var(--mint-pale); }
    .word-chip.es:hover { border-color: var(--mint); }
    .word-chip.es.speaking { border-color: var(--gold); background: var(--gold-pale); }
    .word-chip.es .wc-en { color: var(--mint); }
    .word-breakdown-label { font-size: .68rem; font-weight: 700; letter-spacing: .6px; margin: 8px 0 4px; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    .word-breakdown-label.en { color: var(--gold); background: var(--gold-pale); }
    .word-breakdown-label.es { color: var(--mint); background: var(--mint-pale); border: 1px solid var(--mint-dim); }
    .wt-word-es { font-weight: 700; color: var(--mint); }
    .wt-speak-es { background: var(--mint-pale) !important; }
    .wt-speak-es:hover { background: var(--es-bg) !important; }
    .wc-en { font-size: .82rem; font-weight: 700; color: var(--text); }
    .wc-read { font-size: .65rem; color: var(--text-muted); font-style: italic; }
    .wc-ja { font-size: .7rem; color: var(--text-sub); margin-top: 2px; }
    .wc-note { font-size: .62rem; color: var(--text-muted); }

    /* ── Modals ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 16px;
      overscroll-behavior: contain;
    }
    .modal {
      background: var(--surface); border-radius: 14px; width: 100%; max-width: 540px;
      box-shadow: var(--shadow-lg); overflow: hidden;
      display: flex; flex-direction: column; border: 1px solid var(--border);
      max-height: 88vh;
      max-height: 88dvh;
    }
    .modal-sm { max-width: 360px; }
    .modal-header { background: linear-gradient(135deg, #1a0a10, #2a0d17); color: var(--text); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-bottom: 1px solid var(--pink-dim); }
    .modal-header h2 { font-size: 1rem; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; opacity: .8; line-height: 1; }
    .modal-close:hover { opacity: 1; color: var(--pink); }
    .modal-body {
      padding: 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1 1 auto;
      min-height: 0;
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: .8rem; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; }
    .form-control {
      width: 100%; padding: 9px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .15s;
      font-family: inherit; background: var(--surface2); color: var(--text);
    }
    .form-control:focus { border-color: var(--pink); }
    select.form-control { cursor: pointer; }
    textarea.form-control { resize: vertical; min-height: 70px; }
    .modal-footer {
      display: flex; justify-content: flex-end; gap: 10px;
      flex-shrink: 0; border-top: 1px solid var(--border);
      flex-wrap: wrap;
      padding: 12px 20px max(20px, calc(env(safe-area-inset-bottom, 0px) + 16px));
    }
    .btn-cancel { padding: 8px 18px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--surface2); cursor: pointer; font-size: .88rem; color: var(--text-sub); }
    .btn-cancel:hover { border-color: var(--text-muted); color: var(--text); }
    .btn-save { padding: 8px 22px; background: var(--pink); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: .88rem; font-weight: 700; }
    .btn-save:hover { background: var(--pink-dim); }
    .form-section-label { font-size: .72rem; font-weight: 700; letter-spacing: .7px; padding: 8px 10px 6px; border-radius: 6px; margin: 16px 0 10px; }
    .form-section-label.en { background: var(--gold-pale); color: var(--gold); }
    .form-section-label.es { background: var(--mint-pale); color: var(--mint); border: 1px solid var(--mint-dim); }
    .color-swatch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .1s; }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.selected { border-color: var(--text); transform: scale(1.15); }

    /* ── Detail Modal ── */
    .detail-phrase { font-size: 1.2rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .detail-ipa { font-size: .85rem; color: var(--text-muted); font-family: 'Georgia','Times New Roman',serif; margin-bottom: 4px; }
    .detail-reading { font-size: .85rem; color: var(--text-muted); margin-bottom: 12px; }
    .detail-speak-row { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .detail-speak-btn { display: flex; align-items: center; gap: 6px; padding: 9px 18px; border: none; border-radius: 8px; background: var(--pink); color: #fff; cursor: pointer; font-size: .88rem; font-weight: 700; }
    .detail-speak-btn:hover { background: var(--pink-dim); }
    .detail-speak-btn.speaking { background: var(--gold); color: #000; animation: pulse 1s infinite; }
    .detail-speak-btn.es-btn { background: var(--mint-dim); color: #000; }
    .detail-speak-btn.es-btn:hover { background: var(--mint); }
    .detail-es-block { background: var(--es-bg); border: 1.5px solid var(--mint-dim); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
    .detail-es-phrase { font-size: 1.1rem; font-weight: 800; color: var(--mint); margin-bottom: 3px; }
    .detail-es-ipa { font-size: .82rem; color: var(--mint-dim); font-family: 'Georgia','Times New Roman',serif; margin-bottom: 10px; }
    .detail-section { margin-bottom: 14px; }
    .detail-label { font-size: .73rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 6px; }
    .detail-value { font-size: .9rem; color: var(--text); line-height: 1.55; }
    .detail-example { font-style: italic; color: var(--gold); font-size: .88rem; }
    .word-table { width: 100%; border-collapse: collapse; font-size: .84rem; }

  const PREFERRED_VOICES_EN = ["Google US English","Samantha","Alex","Microsoft Aria Online (Natural) - English (United States)"];

  function useSpeech() {
    const [speakingId,  setSpeakingId]  = useState(null);
    const [voiceName,   setVoiceName]   = useState("");
    const [voiceNameEs, setVoiceNameEs] = useState("");
    const voiceRef   = useRef(null);
    const voiceRefEs = useRef(null);

    const loadVoice = useCallback(() => {
      const voices = window.speechSynthesis?.getVoices() || [];
      if (!voices.length) return;
      let en = null;
      for (const n of PREFERRED_VOICES_EN) { en = voices.find(v => v.name === n); if (en) break; }
      if (!en) en = voices.find(v => v.lang?.startsWith("en-US")) || voices.find(v => v.lang?.startsWith("en")) || voices[0];
      voiceRef.current = en; setVoiceName(en?.name || "");
      let es = null;
      for (const n of PREFERRED_VOICES_ES) { es = voices.find(v => v.name === n); if (es) break; }
      if (!es) es = voices.find(v => v.lang?.startsWith("es-")) || voices.find(v => v.lang?.startsWith("es"));
      voiceRefEs.current = es; setVoiceNameEs(es?.name || "");
    }, []);

    useEffect(() => {
      if (!window.speechSynthesis) return;
      loadVoice();
      window.speechSynthesis.onvoiceschanged = loadVoice;
      return () => window.speechSynthesis.cancel();
    }, [loadVoice]);

    const speak = useCallback((text, id, lang = "en-US") => {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      if (speakingId === id) { setSpeakingId(null); return; }
      const utt  = new SpeechSynthesisUtterance(text);
      const isEs = lang.startsWith("es");
      utt.lang   = lang; utt.rate = isEs ? 0.85 : 0.82; utt.pitch = 1; utt.volume = 1;
      const voice = isEs ? voiceRefEs.current : voiceRef.current;
      if (voice) utt.voice = voice;
      utt.onend  = () => setSpeakingId(null);
      utt.onerror = () => setSpeakingId(null);
      setSpeakingId(id);
      window.speechSynthesis.speak(utt);
    }, [speakingId]);

    return { speakingId, speak, voiceName, voiceNameEs };
  }

      const unique = [...new Set(tokens.map(w => w.toLowerCase()))];

      await Promise.all(unique.slice(0, 18).map(async (word) => {
        try {
          const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
          if (!r.ok) return;
          const d = await r.json();
          if (!Array.isArray(d) || !d[0]) return;
          const entry = d[0];
          let ipa = entry.phonetic;
          if (!ipa && entry.phonetics) { const found = entry.phonetics.find(p => p.text?.trim()); if (found) ipa = found.text; }
          if (ipa) ipaMap[word] = ipa.replace(/^\/|\/$/g, "");
        } catch {}
      }));
      const parts = tokens.map(t => ipaMap[t.toLowerCase()]).filter(Boolean);
      return parts.length ? "/" + parts.join(" ") + "/" : "/" + phrase + "/";
    } catch { return "/" + phrase + "/"; }
  }

  async function fetchEsIpa(phrase) {
    try {
      const tokens = phrase.match(/[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]+/gi) || [];
      if (!tokens.length) return "/" + phrase + "/";
      const unique = [...new Set(tokens.map(w => w.toLowerCase()))];
      const ipaMap = {};
      await Promise.all(unique.slice(0, 12).map(async (word) => {
        try {
          const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/es/${word}`);
          if (!r.ok) return;
          const d = await r.json();
          if (!Array.isArray(d) || !d[0]) return;
          const entry = d[0];
          let ipa = entry.phonetic;
          if (!ipa && entry.phonetics) { const found = entry.phonetics.find(p => p.text?.trim()); if (found) ipa = found.text; }
          if (ipa) ipaMap[word] = ipa.replace(/^\/|\/$/g, "");
        } catch {}
      }));
      const parts = tokens.map(t => ipaMap[t.toLowerCase()]).filter(Boolean);
      return parts.length ? "/" + parts.join(" ") + "/" : "/" + phrase + "/";
    } catch { return "/" + phrase + "/"; }
  }

  /* ── Translation ── */
  async function translateText(text, from, to) {
    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && Array.isArray(data[0])) {
          const translated = data[0].map(chunk => (Array.isArray(chunk) ? chunk[0] : "")).filter(Boolean).join("");
          if (translated && translated !== text) return translated;
        }
      }
    } catch {}
    const url2 = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}%7C${to}`;
    const res2  = await fetch(url2);
    const json  = await res2.json();
    if (Number(json.responseStatus) === 200) {
      const t = json.responseData?.translatedText || "";
      if (t && t !== text && !/^QUERY|^MYMEMORY|^\[/i.test(t)) return t;
    }
    throw new Error(`Translation ${from}→${to} failed`);
  }

  /* ── Word Breakdown ── */
  async function fetchWordBreakdown(phrase, fromLang, toLang, tokenPattern) {
    if (!phrase) return [];
    const rawTokens = phrase.match(tokenPattern) || [];
    if (!rawTokens.length) return [];
    const seen = new Set(); const unique = [];
    for (const t of rawTokens) { const k = t.toLowerCase(); if (!seen.has(k)) { seen.add(k); unique.push(t); } }
    const fallback = unique.slice(0, 14).map(w => ({ w, r: "", m: "", note: "" }));
    try {
      const transMap = {};
      const batch  = unique.slice(0, 14).join("\n");
      const result = await translateText(batch, fromLang, toLang);
      result.split("\n").forEach((line, i) => { if (unique[i] && line.trim()) transMap[unique[i].toLowerCase()] = line.trim(); });
      const built = new Set();
      const translated = rawTokens.filter(t => { const k = t.toLowerCase(); if (built.has(k)) return false; built.add(k); return !!transMap[k]; }).slice(0, 14).map(w => ({ w, r: "", m: transMap[w.toLowerCase()] || "", note: "" }));
      return translated.length > 0 ? translated : fallback;
    } catch { return fallback; }
  }

  async function fetchEnWords(phrase) { return fetchWordBreakdown(phrase, "en", "ja", /[a-zA-Z']+/g); }
  async function fetchEsWords(phrase) { return fetchWordBreakdown(phrase, "es", "ja", /[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]+/gi); }

  /* ── OpenAI — Baseball/Clubhouse プロンプト ── */
  async function openAIEnrich(jaText) {
    const apiKey = (localStorage.getItem("openai_api_key") || "").trim();
    if (!apiKey) throw new Error("no_key");

    const prompt =
`You are a elite bilingual baseball language coach embedded in the dugout and clubhouse of a Major League Baseball team.
Your role is to translate Japanese phrases into authentic, high-energy English and Spanish as used by MLB players, coaches, and managers on the field, in the dugout, and in the clubhouse.

Your English output must capture the real voice of the American clubhouse: direct, competitive, fired-up, using genuine baseball slang and terminology (e.g., "tunnel your pitches", "get ahead in the count", "attack the zone", "battle", "grind", "lock in", "let's ride", "here we go", "play up").

Your Spanish output must reflect the authentic voice of Latin players (Dominican, Venezuelan, Mexican, Cuban) — using natural, passionate baseball Spanish with real clubhouse energy (e.g., "¡arriba!", "vamos", "dale", "tú puedes", "a darle", "eso es", "qué batazo", "en cuenta").

Given the Japanese phrase, output a JSON object with EXACTLY these 6 keys:
{
  "en":       "Premium English — authentic MLB dugout/clubhouse expression",
  "ipa":      "/IPA transcription of the English phrase/",
  "es":       "Premium Spanish — authentic Latin ballplayer expression with real passion",
  "ipa_es":   "/IPA transcription of the Spanish phrase/",
  "words":    [{"w":"EnglishWord","m":"日本語の意味","r":"","note":"品詞・野球用語メモ（日本語）"}],
  "words_es": [{"w":"PalabraES","m":"日本語の意味","r":"","note":"品詞・野球用語メモ（日本語）"}]
}

RULES:
1. "ipa" — REQUIRED. IPA for the English. Wrap in /slashes/.
2. "ipa_es" — REQUIRED. IPA for the Spanish. Wrap in /slashes/. NEVER omit.
3. words / words_es: 3–8 key baseball vocabulary items. note field in Japanese.
4. r field: always "".
5. Prioritize real baseball terminology, slang, and situational expressions over generic translations.
6. For motivational/hype phrases, make them electric and game-ready.

Japanese input: "${jaText}"`;

    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [{ role: "user", content: prompt }],
        temperature: 0.3,
        max_tokens: 1400,
        response_format: { type: "json_object" },
      }),
    });

    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(`OpenAI: ${errBody.error?.message || `HTTP ${res.status}`}`);
    }
    const data    = await res.json();
    const content = data.choices?.[0]?.message?.content || "";
    const jsonStr = content.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();
    const parsed  = JSON.parse(jsonStr);
    if (!parsed.ipa_es && parsed.es) { parsed.ipa_es = "/" + parsed.es + "/"; }
    return parsed;
  }

  /* ── Translate Panel ── */
  function TranslatePanel({ onSaveRequest, speakingId, speak }) {
    const [jaText,   setJaText]   = useState("");
    const [enText,   setEnText]   = useState("");
    const [enStatus, setEnStatus] = useState("idle");
    const [esText,   setEsText]   = useState("");
    const [esStatus, setEsStatus] = useState("idle");
    const [errMsg,   setErrMsg]   = useState("");
    const [saving,   setSaving]   = useState(false);
    const [saveStep, setSaveStep] = useState("");
    const timerRef = useRef(null);

    useEffect(() => {
      const q = jaText.trim();
      if (!q) { setEnText(""); setEnStatus("idle"); setEsText(""); setEsStatus("idle"); setErrMsg(""); return; }
      setEnStatus("loading"); setEsText(""); setEsStatus("idle");
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(async () => {
        try {
          const en = await translateText(q, "ja", "en");
          setEnText(en); setEnStatus("done");
          setEsStatus("loading");
          try { const es = await translateText(en, "en", "es"); setEsText(es); setEsStatus("done"); }
          catch { setEsStatus("error"); }
        } catch {
          setErrMsg("翻訳に失敗しました。ネットワーク接続を確認してください。");
          setEnStatus("error");
        }
      }, 700);
      return () => clearTimeout(timerRef.current);
    }, [jaText]);

    const handleSave = async () => {
      if (!jaText.trim() || saving) return;
      setSaving(true);
      const apiKey = (localStorage.getItem("openai_api_key") || "").trim();
      try {
        if (apiKey) {
          setSaveStep("⚾ GPT-4o-mini で生成中...");
          try {
            const r = await openAIEnrich(jaText.trim());
            const en      = (r.en      || "").trim() || enText || jaText.trim();
            const es      = (r.es      || "").trim();
            const ipa     = (r.ipa     || "").trim() || "/" + en + "/";
            const ipa_es  = (r.ipa_es  || "").trim() || (es ? "/" + es + "/" : "");
            const words   = (Array.isArray(r.words)    && r.words.length    > 0) ? r.words    : en.split(/\s+/).filter(Boolean).map(w => ({ w, m: "", r: "", note: "" }));
            const words_es = (Array.isArray(r.words_es) && r.words_es.length > 0) ? r.words_es : es.split(/\s+/).filter(Boolean).map(w => ({ w, m: "", r: "", note: "" }));
            setSaveStep("💾 保存中...");
            onSaveRequest({ ja: jaText.trim(), en, ipa, words, es, ipa_es, words_es });
            return;
          } catch (e) {
            const msg = e.message === "no_key" ? "APIキー未設定" : e.message;
            console.warn("[OpenAI] failed:", msg, "→ fallback");
            setSaveStep(`⚠ GPT エラー (${msg})。別の方法で保存します...`);
            await new Promise(r => setTimeout(r, 900));
          }
        }
        let en = enText || "";
        if (!en) { setSaveStep("🇺🇸 英語に翻訳中..."); try { en = await translateText(jaText.trim(), "ja", "en"); } catch { en = jaText.trim(); } }
        let es = esText || "";
        if (!es) { setSaveStep("🇪🇸 スペイン語に翻訳中..."); try { es = await translateText(en, "en", "es"); } catch {} }
        setSaveStep("① 🇺🇸 IPA 取得中...");
        let ipa = "/" + en + "/";
        try { const v = await fetchEnIpa(en); if (v) ipa = v; } catch {}
        setSaveStep("② 🇪🇸 IPA 取得中...");
        let ipa_es = es ? "/" + es + "/" : "";
        if (es) { try { const v = await fetchEsIpa(es); if (v) ipa_es = v; } catch {} }
        setSaveStep("③ 🇺🇸 単語解説 生成中...");
        let words = en.split(/\s+/).filter(Boolean).map(w => ({ w, m: "", r: "", note: "" }));
        try { const v = await fetchEnWords(en); if (v && v.length > 0) words = v; } catch {}
        setSaveStep("④ 🇪🇸 単語解説 生成中...");
        let words_es = es.split(/\s+/).filter(Boolean).map(w => ({ w, m: "", r: "", note: "" }));
        if (es) { try { const v = await fetchEsWords(es); if (v && v.length > 0) words_es = v; } catch {} }
        setSaveStep("💾 保存中...");
        onSaveRequest({ ja: jaText.trim(), en, ipa, words, es, ipa_es, words_es });
      } catch (e) { console.warn("[handleSave] unexpected error:", e); }
      finally { setSaving(false); setSaveStep(""); }
    };

    const clear = () => { setJaText(""); setEnText(""); setEnStatus("idle"); setEsText(""); setEsStatus("idle"); setErrMsg(""); window.speechSynthesis?.cancel(); };
    const canSave = enStatus === "done" && !saving;
    const hasApiKey = !!(localStorage.getItem("openai_api_key") || "").trim();

    return (
      <div className="translate-panel">
        <div className="translate-panel-header">
          <div className="translate-panel-header-icon">⚾</div>
          <div className="translate-panel-title">Clubhouse Translator</div>
          <div className="translate-panel-subtitle">
            {hasApiKey ? "GPT-4o-mini 強化" : "JA → EN → ES"}
          </div>
        </div>
        <div className="translate-body">
          <div className="translate-src">
            <div className="translate-lang-label">🇯🇵 日本語</div>
            <textarea
              className="translate-textarea"
              value={jaText}
              onChange={e => setJaText(e.target.value)}
              placeholder="例：初球からストライクゾーンを攻めろ"
              rows={4}
              maxLength={300}
            />
            <div className="translate-src-footer">
              <button className="translate-clear" onClick={clear} type="button">クリア</button>
              <span className="char-count">{jaText.length}/300</span>
            </div>
          </div>
          <div className="translate-divider"><div className="translate-arrow-icon">→</div></div>
          <div className="translate-dst">
            <div className="lang-block">
              <div className="lang-flag-label en">🇺🇸 English</div>
              {enStatus === "idle" && <div className="translate-result-text placeholder">ここに英語訳が表示されます</div>}
              {enStatus === "loading" && <div className="translate-result-text loading"><span className="spinner-sm"></span>翻訳中...</div>}
              {enStatus === "error" && <div className="translate-result-text error">{errMsg}</div>}
              {enStatus === "done" && <div className="translate-result-text">{enText}</div>}
              <div className="lang-speak-row">
                <button className={`speak-big-btn${speakingId==="translate-en"?" speaking":""}`} onClick={() => speak(enText, "translate-en", "en-US")} disabled={!enText} type="button">
                  <SpeakerIcon speaking={speakingId==="translate-en"}/> 聞く
                </button>
              </div>
            </div>
            <div className="lang-block lang-block-es">
              <div className="lang-flag-label es">🇪🇸 Español</div>
              {esStatus === "idle" && <div className="translate-result-text placeholder">ここにスペイン語訳が表示されます</div>}
              {esStatus === "loading" && <div className="translate-result-text loading"><span className="spinner-sm"></span>翻訳中...</div>}
              {esStatus === "error" && <div className="translate-result-text error">スペイン語翻訳に失敗しました</div>}
              {esStatus === "done" && <div className="translate-result-text es-text">{esText}</div>}
              <div className="lang-speak-row">
                <button className={`speak-big-btn es-btn${speakingId==="translate-es"?" speaking":""}`} onClick={() => speak(esText, "translate-es", "es-ES")} disabled={!esText} type="button">
                  <SpeakerIcon speaking={speakingId==="translate-es"}/> Escuchar
                </button>
              </div>
            </div>
          </div>
        </div>
        <div className="translate-save-row">
          <button className="save-translate-btn" onClick={handleSave} disabled={!jaText.trim() || saving} type="button">
            {saving ? <><span className="spinner-sm"></span>{saveStep || "保存中..."}</> : <>＋ 単語帳に保存</>}
          </button>
        </div>
      </div>
    );
  }

            <div className="detail-section"><div className="detail-label">意味</div><div className="detail-value">{phrase.meaning}</div></div>
            {phrase.example && <div className="detail-section"><div className="detail-label">Example</div><div className="detail-value detail-example">{phrase.example}</div></div>}
            {phrase.tags?.length > 0 && <div className="detail-section"><div className="detail-label">Tags</div><div className="card-tags">{phrase.tags.map(t => <span key={t} className="tag">{t}</span>)}</div></div>}
            {phrase.words?.length > 0 && (
              <div className="detail-section">
                <div className="detail-label">🇺🇸 English Words</div>
                <table className="word-table"><tbody>{phrase.words.map((w,i)=>(
                  <tr key={i}>
                    <td><span className="wt-word">{w.w}</span>{w.r && <span className="wt-read">{w.r}</span>}</td>
                    <td className="wt-ja">{w.m}</td>
                    <td>{w.note && <span className="wt-note">{w.note}</span>}</td>
                    <td><button className={`wt-speak${speakingId===`dw-${phrase.id}-${i}`?" speaking":""}`} onClick={() => speak(w.w, `dw-${phrase.id}-${i}`, "en-US")}><SpeakerIcon size={13}/></button></td>
                  </tr>
                ))}</tbody></table>
              </div>
            )}
            {phrase.words_es?.length > 0 && (
              <div className="detail-section">
                <div className="detail-label">🇪🇸 Spanish Words</div>
                <table className="word-table"><tbody>{phrase.words_es.map((w,i)=>(
                  <tr key={i}>
                    <td><span className="wt-word wt-word-es">{w.w}</span>{w.r && <span className="wt-read">{w.r}</span>}</td>
                    <td className="wt-ja">{w.m}</td>
                    <td>{w.note && <span className="wt-note">{w.note}</span>}</td>
                    <td><button className={`wt-speak wt-speak-es${speakingId===`dwe-${phrase.id}-${i}`?" speaking":""}`} onClick={() => speak(w.w, `dwe-${phrase.id}-${i}`, "es-ES")}><SpeakerIcon size={13}/></button></td>
                  </tr>
                ))}</tbody></table>
              </div>
            )}
          </div>
          <div className="modal-footer">
            <button className="btn-cancel" onClick={() => onDelete(phrase.id)}>削除</button>
            <button className="btn-save" onClick={() => onEdit(phrase)}>編集</button>
          </div>
        </div>
      </div>
    );
  }

  /* ── Category Modal ── */
  function CategoryModal({ onSave, onClose }) {
    const [label, setLabel] = useState("");
    const [paletteIdx, setPaletteIdx] = useState(0);
    const submit = (e) => {
      e.preventDefault();
      const name = label.trim();
      if (!name) return;
      const key = "cat-" + Date.now();
      onSave({ key, label:name, paletteIdx, builtIn:false });
    };
    return (
      <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
        <div className="modal modal-sm">
          <div className="modal-header">
            <h2>＋ グループ追加</h2>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>
          <form onSubmit={submit}>
            <div className="modal-body">
              <div className="form-group">
                <label>グループ名</label>
                <input className="form-control" value={label} onChange={e => setLabel(e.target.value)} placeholder="例：遠征・移動" required/>
              </div>
              <div className="form-group">
                <label>カラー</label>
                <div className="color-swatch-row">
                  {PALETTE.map((p,i)=>(
                    <div key={i} className={`color-swatch${paletteIdx===i?" selected":""}`} style={{background:p.text}} onClick={() => setPaletteIdx(i)}></div>
                  ))}
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button type="button" className="btn-cancel" onClick={onClose}>キャンセル</button>
              <button type="submit" className="btn-save">追加</button>
            </div>
          </form>
        </div>
      </div>
    );
  }

  function App() {
    const [phrases, setPhrases] = useState(() => {
      try {
        const saved = localStorage.getItem(STORAGE_KEYS.phrases) || localStorage.getItem("clubhouse_phrases");
        return saved ? JSON.parse(saved) : INITIAL_PHRASES;
      } catch { return INITIAL_PHRASES; }
    });
    const [customCats, setCustomCats] = useState(() => {
      try {
        const saved = localStorage.getItem(STORAGE_KEYS.customCats) || localStorage.getItem("clubhouse_custom_cats");
        return saved ? JSON.parse(saved) : [];
      } catch { return []; }
    });
    const [activeCat, setActiveCat] = useState("all");
    const [search, setSearch] = useState("");
    const [showAdd, setShowAdd] = useState(false);
    const [editTarget, setEditTarget] = useState(null);
    const [detailTarget, setDetail] = useState(null);
    const [showCat, setShowCat] = useState(false);
    const [showSettings, setShowSettings] = useState(false);
    const [addPreset, setAddPreset] = useState(null);
    const [openWords, setOpenWords] = useState({});
    const [offline, setOffline] = useState(!navigator.onLine);
    const [syncStatus, setSyncStatus] = useState(db.ready ? "Supabase接続中" : "ローカル保存");
    const { speakingId, speak, voiceName, voiceNameEs } = useSpeech();

    const categories = useMemo(() => [...DEFAULT_CATEGORIES, ...customCats], [customCats]);
    const catMap = useMemo(() => Object.fromEntries(categories.map(c => [c.key, c])), [categories]);

    useEffect(() => {
      const goOnline  = () => setOffline(false);
      const goOffline = () => setOffline(true);
      window.addEventListener("online", goOnline);
      window.addEventListener("offline", goOffline);
      return () => { window.removeEventListener("online", goOnline); window.removeEventListener("offline", goOffline); };
    }, []);

    useEffect(() => {
      let cancelled = false;
      if (!db.ready) return;
      (async () => {
        setSyncStatus("Supabase同期中...");
        try {
          const res = await db.loadAll();
          if (cancelled || !res) return;

          setPhrases(prev => {
            const merged = new Map();
            for (const p of INITIAL_PHRASES) merged.set(String(p.id), p);
            for (const p of prev || []) merged.set(String(p.id), p);
            for (const p of res.phrases || []) merged.set(String(p.id), p);
            const arr = [...merged.values()];
            localStorage.setItem(STORAGE_KEYS.phrases, JSON.stringify(arr));
            return arr;
          });

          setCustomCats(prev => {
            const merged = new Map();
            for (const c of prev || []) merged.set(String(c.key), c);
            for (const c of res.customCats || []) merged.set(String(c.key), c);
            const arr = [...merged.values()];
            localStorage.setItem(STORAGE_KEYS.customCats, JSON.stringify(arr));
            return arr;
          });

          setSyncStatus("Supabase同期済み");
        } catch (e) {
          console.warn("[Supabase] loadAll:", e);
          setSyncStatus("ローカル保存");
        }
      })();
      return () => { cancelled = true; };
    }, []);

    useEffect(() => { localStorage.setItem(STORAGE_KEYS.phrases, JSON.stringify(phrases)); }, [phrases]);
    useEffect(() => { localStorage.setItem(STORAGE_KEYS.customCats, JSON.stringify(customCats)); }, [customCats]);

    const filtered = useMemo(() => {
      const q = search.trim().toLowerCase();
      return phrases.filter(p => {
        const catOk = activeCat === "all" || p.category === activeCat;
        const hay = [p.phrase, p.phrase_es, p.reading, p.meaning, p.example, ...(p.tags||[])].join(" ").toLowerCase();
        return catOk && (!q || hay.includes(q));
      });
    }, [phrases, activeCat, search]);

    const savePhrase = async (form) => {
      const normalized = {
        ...form,
        id: form.id || Date.now(),
        category: form.category || categories[0]?.key || "pitching",
        tags: typeof form.tags === "string" ? form.tags.split(",").map(s=>s.trim()).filter(Boolean) : (form.tags || []),
        words: form.words || [],
        words_es: form.words_es || [],
      };

      setPhrases(prev => {
        const exists = prev.some(p => p.id === normalized.id);
        return exists ? prev.map(p => p.id === normalized.id ? normalized : p) : [normalized, ...prev];
      });
      setShowAdd(false); setEditTarget(null); setDetail(null); setAddPreset(null);

      const result = await db.upsertPhrase(normalized);
      if (result?.ok) setSyncStatus("Supabase保存済み");
      else setSyncStatus("ローカル保存中");
    };

    const deletePhrase = async (id) => {
      setPhrases(prev => prev.filter(p => p.id !== id));
      const result = await db.deletePhrase(id);
      if (result?.ok) setSyncStatus("Supabase削除済み");
      else setSyncStatus("ローカル保存中");
    };

    const toggleStar = async (p, e) => {
      e.stopPropagation();
      const next = { ...p, starred: !p.starred };
      setPhrases(prev => prev.map(x => x.id === p.id ? next : x));
      const result = await db.upsertPhrase(next);
      if (result?.ok) setSyncStatus("Supabase保存済み");
      else setSyncStatus("ローカル保存中");
    };

    const addCategory = async (c) => {
      setCustomCats(prev => [...prev, c]);
      setShowCat(false);
      const result = await db.upsertCategory(c);
      if (result?.ok) setSyncStatus("Supabase保存済み");
      else setSyncStatus("ローカル保存中");
    };

    const delCategory = async (key, e) => {
      e.stopPropagation();
      if (!confirm("このグループを削除しますか？フレーズは「クラブハウス」に移動します。")) return;
      setCustomCats(prev => prev.filter(c => c.key !== key));
      const updated = phrases.map(p => p.category === key ? { ...p, category:"clubhouse" } : p);
      setPhrases(updated);
      if (activeCat === key) setActiveCat("all");
      const result = await db.deleteCategory(key);
      for (const p of updated.filter(p => p.category === "clubhouse")) await db.upsertPhrase(p);
      if (result?.ok) setSyncStatus("Supabase削除済み");
      else setSyncStatus("ローカル保存中");
    };

    const handleTranslateSave = ({ ja, en, ipa, words, es, ipa_es, words_es }) => {
      setAddPreset({
        phrase: en, ipa, reading:"", meaning: ja,
        phrase_es: es || "", ipa_es: ipa_es || "", words_es: words_es || [],
        category: activeCat !== "all" ? activeCat : "clubhouse",
        example:"", tags:["translated"], starred:false, words
      });
      setShowAdd(true);
    };

    const toggleWords = (id, e) => {
      e.stopPropagation();
      setOpenWords(o => ({ ...o, [id]: !o[id] }));
    };

    const apiMode = !!(localStorage.getItem("openai_api_key") || "").trim();

    return (
      <>
        {offline && <div className="offline-banner">オフラインです。保存は端末内に保持され、オンライン復帰後に再読込でSupabase同期されます。</div>}
        <header className="header">
          <div className="header-inner">
            <div className="header-top">
              <div className="header-icon">⚾</div>
              <div style={{flex:1}}>
                <h1>Clubhouse Phrase Book <span className="cc-badge">CITY CONNECT</span></h1>
              </div>
              <button className="settings-btn" onClick={() => setShowSettings(true)} title="API設定">⚙️</button>
            </div>
            <div className="header-sub">MLB dugout English + Latin clubhouse Spanish</div>
            <div className="voice-indicator">
              🔊 EN: {voiceName || "Loading..."} / ES: {voiceNameEs || "Device default"}
              <span className={`api-mode-badge ${apiMode ? "openai" : "fallback"}`}>{apiMode ? "GPT-4o-mini" : "Fallback API"}</span>
              <span className="api-mode-badge fallback">{syncStatus}</span>
            </div>
          </div>
        </header>

        <main className="main">
          <TranslatePanel onSaveRequest={handleTranslateSave} speakingId={speakingId} speak={speak}/>

          <div className="toolbar">
            <div className="search-wrap">
              <span className="search-icon">🔍</span>
              <input className="search-input" value={search} onChange={e => setSearch(e.target.value)} placeholder="フレーズ・意味・タグを検索"/>
            </div>
            <button className="add-btn" onClick={() => { setAddPreset(null); setShowAdd(true); }}>＋ フレーズ追加</button>
          </div>

          <div className="filter-row">
            <button className={`filter-btn${activeCat==="all"?" active":""}`} onClick={() => setActiveCat("all")}>ALL <span>{phrases.length}</span></button>
            {categories.map(c => {
              const p = palColor(c.paletteIdx);
              const count = phrases.filter(x => x.category === c.key).length;
              return (
                <button key={c.key} className={`filter-btn${activeCat===c.key?" active":""}`} onClick={() => setActiveCat(c.key)}
                  style={activeCat===c.key ? {background:p.text,borderColor:p.text,color:"#000"} : {}}>
                  {c.label} <span>{count}</span>
                  {!c.builtIn && <span className="del-cat" onClick={(e)=>delCategory(c.key,e)}>✕</span>}
                </button>
              );
            })}
            <button className="add-cat-btn" onClick={() => setShowCat(true)}>＋ グループ</button>
          </div>

          <div className="stats">{filtered.length} phrases shown</div>

          {filtered.length === 0 ? (
            <div className="empty"><div className="empty-icon">⚾</div><p>該当するフレーズがありません</p></div>
          ) : (
            <div className="card-grid">
              {filtered.map(p => {
                const cat = catMap[p.category] || categories[0];
                const col = palColor(cat?.paletteIdx || 0);
                const wordsOpen = !!openWords[p.id];
                const sidEn = `card-${p.id}-en`;
                const sidEs = `card-${p.id}-es`;
                return (
                  <div key={p.id} className="card" style={{borderTopColor:col.border}} onClick={() => setDetail(p)}>
                    <div className="card-actions">
                      <button className="icon-btn" onClick={(e)=>toggleStar(p,e)} title="スター">{p.starred ? "★" : "☆"}</button>
                      <button className="icon-btn" onClick={(e)=>{e.stopPropagation(); setEditTarget(p);}} title="編集">✏️</button>
                      <button className="icon-btn delete" onClick={(e)=>{e.stopPropagation(); deletePhrase(p.id);}} title="削除">🗑</button>
                    </div>
                    <span className="card-badge" style={{background:col.bg,color:col.text}}>{cat?.label}</span>
                    <div className="card-phrase">{p.phrase}</div>
                    {p.ipa && <div className="card-ipa">{p.ipa}</div>}
                    {p.reading && <div className="card-reading">{p.reading}</div>}
                    {p.phrase_es && (
                      <div className="card-es-block">
                        <div className="card-phrase-es">{p.phrase_es}</div>
                        {p.ipa_es && <div className="card-ipa-es">{p.ipa_es}</div>}
                      </div>
                    )}
                    <div className="card-meaning">{p.meaning}</div>
                    {p.tags?.length > 0 && <div className="card-tags">{p.tags.map(t => <span key={t} className="tag">{t}</span>)}</div>}
                    {wordsOpen && (
                      <>
                        {p.words?.length > 0 && <>
                          <div className="word-breakdown-label en">🇺🇸 English Words</div>
                          <WordBreakdown words={p.words} speakingId={speakingId} speak={speak} phraseId={`${p.id}-en`} lang="en-US"/>
                        </>}
                        {p.words_es?.length > 0 && <>
                          <div className="word-breakdown-label es">🇪🇸 Spanish Words</div>
                          <WordBreakdown words={p.words_es} speakingId={speakingId} speak={speak} phraseId={`${p.id}-es`} lang="es-ES"/>
                        </>}
                      </>
                    )}
                    <div className="card-footer">
                      <div className="card-speak-group">
                        <button className={`speak-btn${speakingId===sidEn?" speaking":""}`} onClick={e => {e.stopPropagation(); speak(p.phrase, sidEn, "en-US");}}>
                          <SpeakerIcon speaking={speakingId===sidEn}/> EN
                        </button>
                        {p.phrase_es && (
                          <button className={`speak-btn es${speakingId===sidEs?" speaking":""}`} onClick={e => {e.stopPropagation(); speak(p.phrase_es, sidEs, "es-ES");}}>
                            <SpeakerIcon speaking={speakingId===sidEs}/> 🇪🇸
                          </button>
                        )}
                      </div>
                      <button className={`word-toggle-btn${wordsOpen?" open":""}`} onClick={e => toggleWords(p.id, e)}>
                        {wordsOpen ? "▲" : "▼"} 単語
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </main>

        {showAdd && (
          <PhraseModal
            phrase={addPreset || editTarget || null}
            onSave={savePhrase}
            onClose={() => { setShowAdd(false); setAddPreset(null); setEditTarget(null); }}
            categories={categories}
          />
        )}
        {editTarget && !showAdd && (
          <PhraseModal phrase={editTarget} onSave={savePhrase} onClose={() => setEditTarget(null)} categories={categories}/>
        )}
        {detailTarget && !showAdd && !editTarget && (
          <DetailModal
            phrase={detailTarget}
            onClose={() => setDetail(null)}
            onEdit={p => { setDetail(null); setEditTarget(p); }}
            onDelete={id => { deletePhrase(id); setDetail(null); }}
            speakingId={speakingId}
            speak={speak}
          />
        )}
        {showCat && <CategoryModal onSave={addCategory} onClose={() => setShowCat(false)}/>}
        {showSettings && <SettingsModal onClose={() => setShowSettings(false)}/>}
      </>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App/>);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
